name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/jarvis-coach-mobile-app-ZYWJf
    paths-ignore:
      - '**.md'
      - '.github/**'

jobs:
  build-apk:
    name: Build APK (local Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Expo CLI
        run: npm install -g expo-cli @expo/cli

      - name: Generate Android project (expo prebuild)
        run: |
          npx expo prebuild --platform android --non-interactive 2>&1

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon 2>&1

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
          ls -lh "$APK"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-coach-${{ github.run_number }}.apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Print download info
        run: |
          echo ""
          echo "====================================="
          echo "  APK BUILD COMPLETE"
          echo "====================================="
          echo "  Download under:"
          echo "  GitHub Actions → Run #${{ github.run_number }}"
          echo "  → Artifacts → jarvis-coach-${{ github.run_number }}.apk"
          echo "====================================="
